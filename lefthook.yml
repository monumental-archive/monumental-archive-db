---
# The org's git hooks, consumed live from the canon at the tag this repo
# pins. Nothing is defined here: hooks are the canon's (typos, actionlint,
# the commit canon, DCO at commit-msg, `mise run ci` at pre-push), and
# enforcement is the shared gate, which no local config can override.
# Personal overrides go in lefthook-local.yml (gitignored).
remotes:
  - git_url: https://github.com/monumental-archive/.github
    ref: v1.61.1
    refetch_frequency: 24h
    configs:
      - lefthook/org-hooks.yml
...
